<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Pantry Jam: Coffee Shop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --wall:#3b2a22; --wall-line:#33241d; --wood:#6e4a36; --wood-dark:#3f281b; --wood-light:#9a6b4f;
  --linen:#f3e6c9; --ink:#3a2314; --gold:#e3a857; --danger:#d9503f;
  --font:"Baloo 2", "Trebuchet MS", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --wall:#2c1f19; --wall-line:#261a15; } }
:root[data-theme="dark"]{ --wall:#2c1f19; --wall-line:#261a15; }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  background-color:var(--wall);
  background-image:linear-gradient(var(--wall-line) 2px,transparent 2px),linear-gradient(90deg,var(--wall-line) 2px,transparent 2px);
  background-size:48px 24px; font-family:var(--font); color:var(--linen);
  display:flex; justify-content:center; overflow:hidden; height:100vh; height:100dvh; overscroll-behavior:none; user-select:none; -webkit-user-select:none;
}
#app{width:100%;max-width:460px;height:100%;padding:max(8px,env(safe-area-inset-top)) 12px max(8px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px}
#app>*{flex:none}
.tray-wrap{flex:1 1 0!important;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}

.hud{display:flex;align-items:center;justify-content:space-between;gap:8px}
.lvl{font-weight:800;font-size:1.25rem;line-height:1.1;white-space:nowrap;min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis}
.lvl small{overflow:hidden;text-overflow:ellipsis}
.lvl small{display:block;font-weight:500;font-size:.85rem;opacity:.75}
.moves{background:var(--wood-dark);border:3px solid var(--wood-light);border-radius:14px;padding:2px 14px;text-align:center;min-width:84px;box-shadow:0 4px 0 #2a170b}
.moves b{display:block;font-size:1.7rem;line-height:1.05}
.moves span{font-size:.75rem;opacity:.8}
.moves.low b{color:#ffb4a6}
.hbtn{background:var(--wood);color:var(--linen);border:0;border-radius:12px;font:700 .9rem var(--font);padding:8px 12px;box-shadow:0 3px 0 var(--wood-dark);cursor:pointer}
.hbtn:focus-visible,.btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

.tray-wrap{padding:8px;background:linear-gradient(var(--wood-light),var(--wood));border-radius:18px;padding:8px;box-shadow:0 6px 0 var(--wood-dark),inset 0 2px 0 rgba(255,255,255,.2)}
#board{position:relative;margin:0 auto;border-radius:12px;background:#3d2414;box-shadow:inset 0 3px 8px rgba(0,0,0,.5);touch-action:none;overflow:hidden}
.bgcell{position:absolute;border-radius:10px;background:rgba(0,0,0,.18)}
.tile{position:absolute;left:0;top:0;padding:3px;transition:transform .15s cubic-bezier(.3,.7,.4,1);will-change:transform;cursor:pointer}
.tile.fall{transition:transform .26s cubic-bezier(.45,0,.6,1.25)}
.face,.fly{width:100%;height:100%;border-radius:24%;position:relative;
  background:radial-gradient(circle at 32% 26%,rgba(255,255,255,.38),transparent 52%),var(--c);
  box-shadow:inset 0 -5px 0 rgba(0,0,0,.25),0 3px 0 rgba(0,0,0,.35);display:grid;place-items:center}
.face svg,.fly svg{width:68%;height:68%;fill:#fff8ea;filter:drop-shadow(0 2px 0 rgba(0,0,0,.25))}
.t2 .face,.fly.t2{box-shadow:inset 0 0 0 3px var(--gold),inset 0 -6px 0 rgba(0,0,0,.28),0 3px 0 rgba(0,0,0,.35)}
.star{position:absolute;right:6%;top:5%;width:24%!important;height:24%!important;fill:var(--gold)!important}
.star.s2{right:auto;left:6%}
.t3 .face,.fly.t3{box-shadow:inset 0 0 0 3px var(--gold),inset 0 0 0 6px rgba(255,236,170,.35),inset 0 -7px 0 rgba(0,0,0,.3),0 0 10px rgba(232,184,74,.55),0 3px 0 rgba(0,0,0,.35)}
.tile.pop .face{animation:pop .34s ease}
@keyframes pop{0%{transform:scale(.4)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
.tile.sel .face{outline:3px solid #fff;outline-offset:-2px}
.fly{position:fixed;z-index:50;pointer-events:none}

.shelf-label{font-size:.8rem;opacity:.75;margin:0 2px -4px}
.slots{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;background:var(--wood-dark);border-radius:14px;padding:7px;box-shadow:inset 0 3px 6px rgba(0,0,0,.45)}
.slot>div,.pip>div{width:100%;height:100%}
.arrive{animation:arrive 360ms linear both}
@keyframes arrive{0%,96%{opacity:0}100%{opacity:1}}
.slot{min-width:0;max-width:64px;justify-self:center;width:100%;overflow:hidden;aspect-ratio:1;border-radius:12px;background:rgba(255,255,255,.07);border:2px dashed rgba(243,230,201,.2);padding:2px}
.slot .face{box-shadow:inset 0 -4px 0 rgba(0,0,0,.25)}
.slots.warn{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

.boxes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
/* ---- tutorial coach layer ---- */
#coach{position:fixed;inset:0;z-index:60;pointer-events:none}
#coach[hidden]{display:none}
#coach .veil{position:absolute;inset:0;background:rgba(20,12,8,.55);opacity:0;transition:opacity .25s;
  -webkit-mask:radial-gradient(circle var(--mr,0px) at var(--mx,50%) var(--my,50%), transparent 98%, #000 100%);
  mask:radial-gradient(circle var(--mr,0px) at var(--mx,50%) var(--my,50%), transparent 98%, #000 100%)}
#coach.on .veil{opacity:1}
#coach .ring{position:absolute;border:3px solid var(--gold);border-radius:14px;box-shadow:0 0 0 3px rgba(227,168,87,.3);
  transition:left .25s,top .25s,width .25s,height .25s;animation:coachPulse 1.3s ease-in-out infinite}
@keyframes coachPulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.06);opacity:.75}}
#coach .hand{position:absolute;width:38px;height:38px;margin:-4px 0 0 -6px;transition:left .25s,top .25s;filter:drop-shadow(0 3px 4px rgba(0,0,0,.45))}
#coach .hand.tapAnim{animation:coachTap 1.3s ease-in-out infinite}
#coach .hand.swipeAnim{animation:coachSwipe 1.5s ease-in-out infinite}
@keyframes coachTap{0%,100%{transform:translate(0,0) scale(1)}45%{transform:translate(0,7px) scale(.88)}}
@keyframes coachSwipe{0%{transform:translate(0,0)}45%{transform:translate(var(--sx,-40px),var(--sy,0px))}55%{transform:translate(var(--sx,-40px),var(--sy,0px))}100%{transform:translate(0,0)}}
#coach .tip{position:absolute;left:50%;transform:translateX(-50%);max-width:min(340px,86vw);background:var(--linen);color:var(--ink);
  border-radius:14px;padding:10px 13px;font-weight:700;font-size:.95rem;line-height:1.3;text-align:center;
  box-shadow:0 6px 0 rgba(0,0,0,.25);pointer-events:auto;transition:top .25s,bottom .25s}
#coach .tip small{display:block;margin-top:5px;font-weight:600;font-size:.8rem;opacity:.65}
.tile.tutBlock{animation:tutNo .3s ease}
@keyframes tutNo{0%,100%{transform:var(--tp,translate(0,0))}25%{filter:brightness(1.6)}75%{filter:brightness(1.6)}}

.col{display:flex;flex-direction:column;align-items:stretch;gap:6px}
.crate{background:linear-gradient(#c28a55,#a26a3f);border-radius:14px;padding:7px 6px 8px;box-shadow:0 5px 0 var(--wood-dark),inset 0 2px 0 rgba(255,255,255,.3);color:var(--ink);transition:transform .25s, opacity .25s}
.crate.done{transform:translateY(-14px) scale(.9);opacity:0}
.crate.enter{animation:enter .3s ease}
@keyframes enter{from{transform:translateY(24px);opacity:0}}
.crate-head{min-width:0;display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;column-gap:4px;row-gap:1px;background:var(--linen);border-radius:9px;padding:4px 5px 3px}
.crate-head .icon{width:clamp(22px,7vw,30px);height:clamp(22px,7vw,30px);flex:none}
.crate-head .icon .face{border-radius:8px}
.crate-head .name{grid-column:1/-1;text-align:center;font-weight:800;font-size:.85rem;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crate-head .recipe{font-size:.72rem;font-weight:700;opacity:.8;display:flex;align-items:center;justify-content:center;gap:2px;white-space:nowrap}
.crate-head .recipe i{display:inline-block;width:13px;height:13px}
.pips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;margin-top:6px}
.pip{aspect-ratio:1;border-radius:9px;background:rgba(58,35,20,.35);box-shadow:inset 0 2px 3px rgba(0,0,0,.35);padding:1px}
.pip .face{border-radius:8px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
.empty-col{border:2px dashed rgba(243,230,201,.25);border-radius:14px;height:96px;display:grid;place-items:center;font-size:.8rem;opacity:.6}
.queue{display:flex;gap:4px;justify-content:center;min-height:24px}
.queue .q{width:24px;height:24px;opacity:.85}
.queue .q .face{border-radius:7px;box-shadow:inset 0 -2px 0 rgba(0,0,0,.25)}
.queue .more{font-size:.8rem;font-weight:700;opacity:.8;align-self:center}

.overlay{position:fixed;inset:0;background:rgba(20,30,24,.72);display:none;place-items:center;z-index:100;padding:20px}
.overlay.show{display:grid}
.card{background:var(--linen);color:var(--ink);border-radius:22px;padding:22px 20px;max-width:340px;width:100%;text-align:center;box-shadow:0 8px 0 var(--wood-dark);animation:enter .3s;max-height:calc(100dvh - 40px);overflow:auto;overscroll-behavior:contain}
/* ---- recipe book ---- */
.book{display:grid;gap:10px;margin:12px 0 6px;text-align:left}
.fam{background:#e6d5b1;border-radius:14px;padding:9px 10px}
.fam .step{display:flex;align-items:center;gap:6px;min-width:0}
.fam .step+.step{margin-top:7px;padding-top:7px;border-top:1px dashed rgba(58,35,20,.22)}
.fam .ic{width:30px;height:30px;flex:none}
.fam .ic .face{border-radius:8px}
.fam .ic.unk{display:grid;place-items:center;border-radius:8px;background:rgba(58,35,20,.1);border:2px dashed rgba(58,35,20,.35);font-weight:800;font-size:1rem;opacity:.65}
.fam .step.locked .lbl{opacity:.55}
.fam .x{font-weight:800;font-size:.8rem;opacity:.7;flex:none}
.fam .arrow{flex:none;opacity:.55;font-weight:800}
.fam .lbl{min-width:0;font-size:.78rem;font-weight:700;line-height:1.1;overflow:hidden;text-overflow:ellipsis}
.fam .lbl i{display:block;font-style:normal;font-weight:600;font-size:.7rem;opacity:.6}
.book-note{font-size:.82rem;opacity:.72;margin:8px 0 2px;text-align:left}
.card h2{margin:0;font-size:1.7rem;line-height:1.1}
.card p{margin:8px 0 14px;line-height:1.4}
.stars{display:flex;justify-content:center;gap:6px;margin:10px 0 4px}
.stars svg{width:44px;height:44px;fill:#d8c9a8}
.stars svg.on{fill:var(--gold)}
.btn{display:block;width:100%;border:0;border-radius:14px;font:800 1.05rem var(--font);padding:11px;margin-top:8px;cursor:pointer;background:#5f8f4e;color:#fff;box-shadow:0 4px 0 #3b5f2f}
.btn.alt{background:var(--wood);box-shadow:0 4px 0 var(--wood-dark)}
.pantry{display:flex;align-items:center;gap:4px;padding:5px 8px}
.pantry .pi{width:26px;height:26px}
.pantry .pi .face{border-radius:7px}
.pantry b{font-size:1.05rem;min-width:14px}
.pantry.bump{animation:bump .3s}
@keyframes bump{50%{transform:scale(1.18)}}
.stock{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;margin:12px 0 4px}
.sitem{display:flex;align-items:center;gap:10px;min-width:0;background:#e6d5b1;border-radius:12px;padding:6px}
.sitem .ic{width:36px;height:36px;flex:none}
.sitem .ic .face{border-radius:9px}
.sitem .meta{flex:1;min-width:0;text-align:left;line-height:1.1;font-size:.85rem;white-space:nowrap}
.sitem .meta b{display:block;font-size:.95rem}
.step{display:flex;align-items:center;gap:6px;flex:none}
.step button{width:28px;height:28px;border-radius:9px;border:0;background:var(--wood);color:var(--linen);font:800 1.1rem var(--font);cursor:pointer;box-shadow:0 2px 0 var(--wood-dark)}
.step button:disabled{opacity:.35;cursor:default}
.step span{min-width:18px;font-weight:800;text-align:center}
.gain{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:6px;margin:6px 0;max-width:100%}
.gain>div{display:flex;align-items:center;justify-content:center;gap:2px;font-weight:800;font-size:.95rem;min-width:0;background:#e6d5b1;border-radius:10px;padding:5px 2px}
.gain .ic{width:26px;height:26px;flex:none}
.gain .ic .face{border-radius:8px}
.tile.boost .face{animation:pop .4s ease}
.logo{display:flex;align-items:center;justify-content:center;gap:10px}
.logo .lj{width:44px;height:44px;transform:rotate(-8deg)}
.logo .lj .face{border-radius:12px}
.levels{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin:14px 0 6px}
.lv{aspect-ratio:1;border:0;border-radius:12px;background:var(--wood);color:var(--linen);font:800 1.2rem var(--font);box-shadow:0 3px 0 var(--wood-dark);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;padding:0}
.lv small{display:flex;gap:1px;margin-top:3px}
.lv small svg{width:10px;height:10px;fill:rgba(255,255,255,.3)}
.lv small svg.on{fill:var(--gold)}
.lv:disabled{background:#cdbb97;color:#9c8866;box-shadow:0 3px 0 #b3a07c;cursor:default}
.lv.cur{outline:3px solid #5f8f4e;outline-offset:1px}
.help{font-size:.9rem;text-align:left}
.help li{margin:4px 0}
.credit{font-size:.7rem;opacity:.55;text-align:center}
.credit a{color:inherit}
@media (max-width:430px){
  .hud{gap:5px}
  .hbtn{padding:7px 8px}
  .lvl{font-size:1.05rem}.lvl small{font-size:.76rem}
  .moves{min-width:68px;padding:2px 9px}.moves b{font-size:1.45rem}.moves span{font-size:.7rem}
}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media (max-height:740px){
  #app{gap:6px}
  .lvl{font-size:.95rem}.lvl small{font-size:.72rem}
  .hud{gap:6px}.moves{min-width:62px}
  .moves{padding:0 10px;min-width:70px}.moves b{font-size:1.35rem}
  .hbtn{padding:6px 10px}
  .shelf-label{display:none}
  .slots{padding:5px;gap:5px}
  .crate{padding:5px 5px 6px}
  .crate-head .icon{width:24px;height:24px}
  .crate-head .name{font-size:.8rem}
  .pips{margin-top:4px}
  .queue{min-height:18px}.queue .q{width:18px;height:18px}
  .credit{display:none}
  .empty-col{height:80px}
}
</style>
</head>
<body>
<div id="app">
  <div class="hud">
    <div class="lvl" id="lvlTitle" role="button" tabindex="0" style="cursor:pointer" title="Bölümler">Bölüm 1<small>Çilek bahçesi</small></div>
    <div style="display:flex;gap:6px;align-items:center;flex:none">
      <button class="hbtn pantry" id="pantryBtn" aria-label="Kilerim"><span class="pi" id="pantryIcon"></span><b id="pantryCount">0</b></button>
      <button class="hbtn" id="bookBtn" aria-label="Tarif defteri" title="Tarif defteri"><svg viewBox="0 0 24 24" width="18" height="18" style="display:block" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4.5A1.5 1.5 0 0 1 5.5 3H19v15H5.5A1.5 1.5 0 0 0 4 19.5z"/><path d="M4 19.5A1.5 1.5 0 0 0 5.5 21H20"/><path d="M8.5 7.5h6M8.5 11h4"/></svg></button>
      <button class="hbtn" id="soundBtn" aria-label="Ses"><svg viewBox="0 0 24 24" width="18" height="18" style="display:block" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" id="soundIcon"></svg></button>
      <button class="hbtn" id="restartBtn" aria-label="Bölümü baştan başlat" title="Baştan"><svg viewBox="0 0 24 24" width="18" height="18" style="display:block" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v5h5"/></svg></button>
      <div class="moves" id="moves"><b>0</b><span>hamle</span></div>
    </div>
  </div>
  <div class="tray-wrap"><div id="board"></div></div>
  <div class="shelf-label">Bekleme rafı</div>
  <div class="slots" id="slots"></div>
  <div class="boxes" id="boxes"></div>
  <div class="credit">İkonlar: <a href="https://game-icons.net" target="_blank" rel="noopener">game-icons.net</a> (Delapouite, Lorc, Rihlsul), CC BY 3.0</div>
</div>

<div id="coach" hidden>
  <div class="veil"></div>
  <div class="ring"></div>
  <svg class="hand" viewBox="0 0 24 24" fill="#f3e6c9" stroke="#3a2314" stroke-width="1.4" stroke-linejoin="round"><path d="M9 11V4.6a1.6 1.6 0 0 1 3.2 0V11V8.4a1.5 1.5 0 0 1 3 0V11v-1.1a1.5 1.5 0 0 1 3 0V16a5.5 5.5 0 0 1-5.5 5.5h-1.2a5.3 5.3 0 0 1-4.3-2.2l-2.6-3.7a1.5 1.5 0 0 1 2.2-2l1.9 1.8V11z"/></svg>
  <div class="tip"></div>
</div>
<div class="overlay" id="overlay"><div class="card" id="card"></div></div>

let SEEN = {}; try{ SEEN = JSON.parse(localStorage.getItem(SEEN_KEY)||'{}')||{}; }catch(e){ SEEN={}; }
function saveSeen(){ try{ localStorage.setItem(SEEN_KEY, JSON.stringify(SEEN)); }catch(e){} }
let discoverQ=[];
function see(item){
  if(!item || SEEN[item]) return;
  /* the tutorial is a sandbox: only the merge it actually teaches counts as learned,
     so side merges there still earn their panel in real play */
  if(S && S.L.tutorial){ if(item==='espresso'){ SEEN[item]=1; saveSeen(); } return; }
  SEEN[item]=1; saveSeen();
  if(ITEMS[item].from) discoverQ.push(item);
}
/* a recipe is readable once you have made it, or while this level asks for it */
function known(item){
  if(!item || ITEMS[item].tier===1 || SEEN[item]) return true;
  return !!(S && S.L.columns && S.L.columns.some(q=>q.includes(item)));
}
let PROG={unlocked:0,stars:{}}; try{ PROG=Object.assign(PROG, JSON.parse(localStorage.getItem('kahve-prog-v2')||'{}')); }catch(e){}
function saveProg(){ try{ localStorage.setItem('kahve-prog-v2', JSON.stringify(PROG)); }catch(e){} }
function saveStock(){ try{ localStorage.setItem(STOCK_KEY, JSON.stringify(STOCK)); }catch(e){} }
function stockTotal(){ return TIER2.reduce((a,k)=>a+(STOCK[k]||0),0); }
Object.keys(STOCK).forEach(k=>{ if(STOCK[k]>0 && !SEEN[k]){ SEEN[k]=1; } }); saveSeen();
function renderPantry(){ document.getElementById('pantryIcon').innerHTML=faceHTML('espresso',false); document.getElementById('pantryCount').textContent=stockTotal(); }
const sleep = ms => new Promise(r=>setTimeout(r,ms));
const STAR_PATH = 'M12 2l2.9 6.3 6.9.7-5.2 4.6 1.5 6.8L12 17l-6.1 3.4 1.5-6.8L2.2 9l6.9-.7z';

function iconSVG(item, withStar){
  const ds = PATHS[item].map(d=>`<path d="${d}"/>`).join('');
  return `<svg viewBox="0 0 512 512" aria-hidden="true">${ds}</svg>` +
    (withStar && ITEMS[item].tier>=2 ? `<svg class="star" viewBox="0 0 24 24"><path d="${STAR_PATH}"/></svg>` + (ITEMS[item].tier===3?`<svg class="star s2" viewBox="0 0 24 24"><path d="${STAR_PATH}"/></svg>`:'') : '');
}
function faceHTML(item, star=true){ return `<div class="face" style="--c:${ITEMS[item].color}">${iconSVG(item, star)}</div>`; }

let S, uid=0, levelIndex=0, cell=56;
const boardEl = document.getElementById('board');

function startLevel(i){
  levelIndex = i; const L = LEVELS[i];
  if(S) S.dead=true; clearTimeout(stepTimer); stepTimer=null; document.querySelectorAll('.fly').forEach(f=>f.remove());
  S = { L, rows:L.rows, cols:L.cols, moves:L.moves, grid:[], tiles:new Map(),
        queues:L.columns.map(q=>q.map(w=>({want:w, filled:[], t:[]}))), slots:[], slotT:[], closing:[null,null,null], busy:false, over:false };
  document.getElementById('lvlTitle').innerHTML = L.tutorial ? `Eğitim<small>${L.name==='Eğitim'?'nasıl oynanır':L.name}</small>` : `Bölüm ${i}<small>${L.name}</small>`;
  boardEl.innerHTML='';
  layout();
  for(let r=0;r<S.rows;r++){ S.grid.push([]); for(let c=0;c<S.cols;c++){
    const bg=document.createElement('div'); bg.className='bgcell'; bg.dataset.r=r; bg.dataset.c=c; boardEl.appendChild(bg);
    S.grid[r].push(null);
  }}
  for(let r=0;r<S.rows;r++) for(let c=0;c<S.cols;c++){
    S.grid[r][c] = makeTile(L.board ? L.board[r][c] : pickSpawn(r,c), r, c);
  }
  positionAll(); renderSlots(); renderBoxes(); updateHUD(); renderPantry(); closeOverlay();
  if(typeof TUT!=='undefined'){ if(L.tutorial) TUT.arm(); else TUT.stop(); }
  if(!firstRun && !L.tutorial) showPrep();
}
let firstRun=true, PICK={};
function showPrep(){
  if(stockTotal()===0) return;
  PICK={}; S.busy=true; drawPrep();
}
function drawPrep(){
  const used=Object.values(PICK).reduce((a,b)=>a+b,0);
  const rows=TIER2.filter(k=>STOCK[k]).map(k=>`<div class="sitem"><span class="ic">${faceHTML(k)}</span>
    <div class="meta"><b>${ITEMS[k].name}</b>Stok ${STOCK[k]}</div>
    <div class="step"><button data-act="minus" data-k="${k}" ${!PICK[k]?'disabled':''} aria-label="Azalt">−</button><span>${PICK[k]||0}</span>
    <button data-act="plus" data-k="${k}" ${(PICK[k]||0)>=STOCK[k]||used>=BOOST_MAX?'disabled':''} aria-label="Artır">+</button></div></div>`).join('');
  showOverlay(`<h2>Bölüm ${levelIndex+1}</h2><p style="margin-bottom:0">Kilerinden tahtaya ürün ekle. En fazla ${BOOST_MAX} tane seçebilirsin.</p>
    <div class="stock">${rows}</div>
    <button class="btn" data-act="boost">${used?`${used} ürünle başla`:'Eklemeden başla'}</button>`);
}
async function applyBoost(){
  closeOverlay();
  const picks=[]; Object.entries(PICK).forEach(([k,n])=>{ for(let i=0;i<n;i++) picks.push(k); STOCK[k]-=n; });
  saveStock(); renderPantry();
  const cells=[]; for(let r=0;r<S.rows;r++) for(let c=0;c<S.cols;c++) cells.push([r,c]);
  cells.sort(()=>Math.random()-.5);
  const from=document.getElementById('pantryIcon').getBoundingClientRect();
  await Promise.all(picks.map((k,i)=>(async()=>{
    const [r,c]=cells[i], t=S.grid[r][c]; await sleep(i*150);
    await fly(k, from, t.el.querySelector('.face'));
    SFX.boost(i); setTileItem(t,k); t.el.classList.remove('boost'); void t.el.offsetWidth; t.el.classList.add('boost');
  })()));
  S.busy=false;
}

function layout(){
  const wrap=document.querySelector('.tray-wrap');
  const w = Math.min(wrap.clientWidth - 16, 436), h = wrap.clientHeight - 16;
  cell = Math.max(24, Math.floor(Math.min(w / S.cols, h / S.rows)));
  boardEl.style.width = cell*S.cols+'px'; boardEl.style.height = cell*S.rows+'px';
  boardEl.querySelectorAll('.bgcell').forEach(b=>{
    b.style.left=(+b.dataset.c*cell+3)+'px'; b.style.top=(+b.dataset.r*cell+3)+'px';
    b.style.width=b.style.height=(cell-6)+'px';
  });
  positionAll();
}
window.addEventListener('resize', ()=>S && layout());
new ResizeObserver(()=>S && layout()).observe(document.querySelector('.tray-wrap'));

function makeTile(item, r, c){
  const t = {id:++uid, item, el:document.createElement('div')};
  t.el.className='tile'; t.el.style.width=t.el.style.height=cell+'px';
  setTileItem(t, item); boardEl.appendChild(t.el); S.tiles.set(t.id,t);
  place(t, r, c); return t;
}
function setTileItem(t, item){ t.item=item; t.el.classList.toggle('t2', ITEMS[item].tier>=2); t.el.classList.toggle('t3', ITEMS[item].tier===3); t.el.innerHTML = faceHTML(item); }
function place(t, r, c){ t.el.style.width=t.el.style.height=cell+'px'; t.el.style.transform=`translate(${c*cell}px,${r*cell}px)`; }
function positionAll(){ if(!S.grid.length) return; for(let r=0;r<S.rows;r++) for(let c=0;c<S.cols;c++){ const t=S.grid[r]?.[c]; if(t) place(t,r,c); } }

/* ---- spawn: weighted by what boxes need, never creating a merge on its own ---- */
function demandWeights(){
  const w = {}; S.L.items.forEach(it=> w[it] = S.L.noise);
  S.queues.forEach(q=> q.forEach((b,idx)=>{
    const k = idx===0 ? 3 : 1; const it = ITEMS[b.want];
    if(it.tier===3){ const base=ITEMS[it.from].from; w[base]=(w[base]||0)+5*k; } else if(it.tier===2) w[it.from] = (w[it.from]||0) + 2.2*k; else w[b.want] = (w[b.want]||0) + k;
  }));
  return w;
}
function clusterSizeIf(r,c,item){
  const seen=new Set([r+','+c]), st=[[r,c]]; let n=0;
  while(st.length){ const [y,x]=st.pop(); n++;
    for(const [dy,dx] of [[1,0],[-1,0],[0,1],[0,-1]]){ const ny=y+dy,nx=x+dx, k=ny+','+nx;
      if(ny<0||nx<0||ny>=S.rows||nx>=S.cols||seen.has(k)) continue;
      const t=S.grid[ny][nx]; if(t && t.item===item){ seen.add(k); st.push([ny,nx]); } } }
  return n;
}
function pickSpawn(r,c){
  const w = demandWeights(); let pool = Object.entries(w).filter(([it])=>S.L.items.includes(it));
  for(let tries=0; tries<12 && pool.length; tries++){
    const total = pool.reduce((a,[,v])=>a+v,0); let x=Math.random()*total, pick=pool[0][0];
    for(const [it,v] of pool){ if((x-=v)<=0){ pick=it; break; } }
    if(clusterSizeIf(r,c,pick) < 3) return pick;
    pool = pool.filter(([it])=>it!==pick);
  }
  return S.L.items.find(it=>clusterSizeIf(r,c,it)<3) || S.L.items[0];
}

/* ---- merges ---- */
function findClusters(){
  const seen=new Set(), out=[];
  for(let r=0;r<S.rows;r++) for(let c=0;c<S.cols;c++){
    const t=S.grid[r][c]; if(!t || !ITEMS[t.item].makes || seen.has(r+','+c)) continue;
    const group=[], st=[[r,c]]; seen.add(r+','+c);
    while(st.length){ const [y,x]=st.pop(); group.push([y,x]);
      for(const [dy,dx] of [[1,0],[-1,0],[0,1],[0,-1]]){ const ny=y+dy,nx=x+dx,k=ny+','+nx;
        if(ny<0||nx<0||ny>=S.rows||nx>=S.cols||seen.has(k)) continue;
        const o=S.grid[ny][nx]; if(o && o.item===t.item){ seen.add(k); st.push([ny,nx]); } } }
    if(group.length>=3) out.push(group);
  }
  return out;
}
/* ---- non-blocking resolve: game state updates instantly, animations just follow ---- */

/* ---- sound: synthesized with Web Audio, no files needed ---- */
const SFX=(()=>{
  let ctx=null, master=null, on=true;
  try{ on = localStorage.getItem('pantry-sound')!=='0'; }catch(e){}
  function ensure(){
    if(!ctx){ const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return false;
      ctx=new AC(); master=ctx.createGain(); master.gain.value=.55;
      const comp=ctx.createDynamicsCompressor(); master.connect(comp); comp.connect(ctx.destination); }
    if(ctx.state==='suspended') ctx.resume();
    return true;
  }
  function tone({f=440,f2=0,type='sine',t=0,dur=.15,vol=.3,attack=.006}){
    const n=ctx.currentTime+t, o=ctx.createOscillator(), g=ctx.createGain();
    o.type=type; o.frequency.setValueAtTime(f,n); if(f2) o.frequency.exponentialRampToValueAtTime(f2,n+dur);
    g.gain.setValueAtTime(0.0001,n); g.gain.linearRampToValueAtTime(vol,n+attack); g.gain.exponentialRampToValueAtTime(.0001,n+dur);
    o.connect(g); g.connect(master); o.start(n); o.stop(n+dur+.03);
  }
  let nbuf=null;
  function noise({t=0,dur=.08,vol=.2,freq=1200,q=1,ftype='bandpass'}){
    if(!nbuf){ nbuf=ctx.createBuffer(1,ctx.sampleRate*.5,ctx.sampleRate); const d=nbuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; }
    const n=ctx.currentTime+t, src=ctx.createBufferSource(), fl=ctx.createBiquadFilter(), g=ctx.createGain();
    src.buffer=nbuf; fl.type=ftype; fl.frequency.value=freq; fl.Q.value=q;
    g.gain.setValueAtTime(vol,n); g.gain.exponentialRampToValueAtTime(.0001,n+dur);
    src.connect(fl); fl.connect(g); g.connect(master); src.start(n); src.stop(n+dur+.02);
  }
  const semi=(f,k)=>f*Math.pow(2,k/12);
  const S={
    ui(){ tone({f:700,f2:900,type:'triangle',dur:.06,vol:.12}); },
    pick(){ tone({f:520,f2:820,type:'triangle',dur:.08,vol:.16}); },
    swap(){ noise({dur:.09,vol:.14,freq:2400,q:.8}); tone({f:380,f2:520,type:'sine',dur:.07,vol:.1}); },
    deliver(i){ tone({f:190,f2:110,dur:.09,vol:.35}); noise({dur:.04,vol:.12,freq:900,q:2});
      tone({f:semi(660,[0,4,7][i]||0),type:'triangle',t:.02,dur:.16,vol:.14}); },
    slot(){ tone({f:210,f2:85,dur:.18,vol:.4}); noise({dur:.07,vol:.18,freq:350,ftype:'lowpass'}); },
    warn(){ tone({f:330,type:'square',dur:.07,vol:.05}); tone({f:330,type:'square',t:.12,dur:.07,vol:.05}); },
    merge(chain){ const b=semi(523,Math.min(chain,6)*2);
      [0,4,7].forEach((k,i)=>tone({f:semi(b,k),type:'triangle',t:i*.045,dur:.26,vol:.15}));
      tone({f:semi(b,24),t:.13,dur:.3,vol:.06}); },
    boxDone(){ noise({dur:.1,vol:.25,freq:280,ftype:'lowpass'}); tone({f:160,f2:80,dur:.14,vol:.35});
      tone({f:1318,t:.09,dur:.18,vol:.08}); tone({f:1760,t:.15,dur:.22,vol:.07}); },
    collect(i){ tone({f:semi(880,Math.min(i,12)),type:'sine',dur:.14,vol:.18}); tone({f:semi(1760,Math.min(i,12)),t:.03,dur:.1,vol:.05}); },
    boost(i){ tone({f:semi(660,i*2),type:'triangle',dur:.16,vol:.16}); },
    win(){ [0,4,7,12,16].forEach((k,i)=>tone({f:semi(523,k),type:'triangle',t:i*.09,dur:.35,vol:.16}));
      tone({f:semi(523,24),t:.5,dur:.6,vol:.08}); },
    lose(){ [7,4,0,-5].forEach((k,i)=>tone({f:semi(392,k),type:'sine',t:i*.16,dur:.35,vol:.18})); }
  };
  const api={ get on(){return on;},
    toggle(){ on=!on; try{ localStorage.setItem('pantry-sound',on?'1':'0'); }catch(e){} if(on&&ensure()) S.ui(); return on; },
    unlock(){ if(on) ensure(); } };
  Object.keys(S).forEach(k=> api[k]=(...a)=>{ if(!on||!ensure()) return; try{ S[k](...a); }catch(e){} });
  return api;
})();
let mergeChain=0;
let stepTimer=null, focusCells=[];
function scheduleStep(delay){ if(stepTimer) return; stepTimer=setTimeout(()=>{ stepTimer=null; mergeStep(); }, delay); }
function mergeStep(){
  if(!S || S.dead) return;
  const clusters=findClusters();
  if(!clusters.length){ mergeChain=0; drainSlots(); if(!flushDiscoveries()) checkEnd(); return; }
  const chainNow=mergeChain++; setTimeout(()=>SFX.merge(chainNow),140);
  for(const g of clusters){
    const target = g.find(([r,c])=>focusCells.some(([fr,fc])=>fr===r&&fc===c)) || g.slice().sort((a,b)=>b[0]-a[0]||a[1]-b[1])[0];
    const [tr,tc]=target, keep=S.grid[tr][tc], made=ITEMS[keep.item].makes;
    for(const [r,c] of g){ if(r===tr&&c===tc) continue; const t=S.grid[r][c];
      S.grid[r][c]=null; t.el.style.zIndex=1; place(t,tr,tc);
      setTimeout(()=>{ t.el.remove(); S.tiles.delete(t.id); },150); }
    keep.item=made; see(made);
    setTimeout(()=>{ if(keep.item!==made) return; keep.el.classList.toggle('t2',true); keep.el.classList.toggle('t3',ITEMS[made].tier===3); keep.el.innerHTML=faceHTML(made);
      keep.el.classList.remove('pop'); void keep.el.offsetWidth; keep.el.classList.add('pop'); },140);
  }
  focusCells = gravitySpawn();
  scheduleStep(230);
}
function gravitySpawn(){
  const moved=[], spawned=[];
  for(let c=0;c<S.cols;c++){
    let write=S.rows-1;
    for(let r=S.rows-1;r>=0;r--){ const t=S.grid[r][c]; if(!t) continue;
      if(write!==r){ S.grid[write][c]=t; S.grid[r][c]=null; moved.push([write,c]); t.el.classList.add('fall'); place(t,write,c); }
      write--; }
  }
  for(let c=0;c<S.cols;c++){
    let empties=0; for(let r=0;r<S.rows;r++) if(!S.grid[r][c]) empties++;
    for(let r=empties-1;r>=0;r--){ const t=makeTile(pickSpawn(r,c), r-empties, c); t.el.classList.add('fall'); S.grid[r][c]=t; spawned.push([t,r,c]); }
  }
  if(spawned.length){ void boardEl.offsetWidth; spawned.forEach(([t,r,c])=>place(t,r,c)); }
  const els=[...moved.map(([r,c])=>S.grid[r][c]), ...spawned.map(x=>x[0])];
  setTimeout(()=>els.forEach(t=>t&&t.el.classList.remove('fall')),300);
  return moved;
}

/* ---- boxes & slots ---- */
const ARRIVE_MS=360;
function arriveAttr(t){ const e=performance.now()-(t||0); return e<ARRIVE_MS ? ` class="arrive" style="animation-delay:-${e|0}ms"` : ''; }
function renderBoxes(enterCol=-1){
  const el=document.getElementById('boxes'); el.innerHTML='';
  el.style.gridTemplateColumns=`repeat(${S.queues.length},minmax(0,1fr))`;
  S.queues.forEach((q,ci)=>{
    const col=document.createElement('div'); col.className='col'; col.dataset.col=ci;
    const closing=S.closing[ci];
    const b = closing ? closing.box : q[0];
    if(!b){ col.innerHTML='<div class="empty-col">Tamamlandı</div>'; el.appendChild(col); return; }
    const it=ITEMS[b.want];
    const recipe = it.tier>=2 ? `<div class="recipe">3 × <i>${faceHTML(it.from,false)}</i></div>` : `<div class="recipe">taze</div>`;
    let pips=''; for(let i=0;i<BOX_NEED;i++) pips+=`<div class="pip">${b.filled[i]?`<div${arriveAttr(b.t[i])}>${faceHTML(b.filled[i])}</div>`:''}</div>`;
    const rest = closing ? q : q.slice(1), shown=rest.slice(0,3).map(x=>`<div class="q">${faceHTML(x.want)}</div>`).join('');
    col.innerHTML=`<div class="crate${ci===enterCol?' enter':''}${closing&&closing.done?' done':''}"><div class="crate-head"><div class="icon">${faceHTML(b.want)}</div>${recipe}<div class="name">${it.name}</div></div><div class="pips">${pips}</div></div>
      <div class="queue">${shown}${rest.length>3?`<span class="more">+${rest.length-3}</span>`:''}</div>`;
    el.appendChild(col);
  });
}
function renderSlots(){
  const el=document.getElementById('slots'); el.innerHTML='';
  for(let i=0;i<SLOT_MAX;i++){ const s=document.createElement('div'); s.className='slot';
    if(S.slots[i]) s.innerHTML=`<div${arriveAttr(S.slotT[i])}>${faceHTML(S.slots[i])}</div>`; el.appendChild(s); }
}
function activeBoxFor(item){
  let best=-1;
  S.queues.forEach((q,ci)=>{ const b=q[0]; if(b && b.want===item && b.filled.length<BOX_NEED){
    if(best<0 || b.filled.length > S.queues[best][0].filled.length) best=ci; }});
  return best;
}
async function fly(item, fromRect, toEl){
  if(!toEl) return; const to=toEl.getBoundingClientRect(), f=document.createElement('div');
  f.className='fly'+(ITEMS[item].tier>=2?' t2':'')+(ITEMS[item].tier===3?' t3':''); f.style.setProperty('--c',ITEMS[item].color); f.innerHTML=iconSVG(item,true);
  Object.assign(f.style,{left:fromRect.left+'px',top:fromRect.top+'px',width:fromRect.width+'px',height:fromRect.height+'px',transformOrigin:'0 0'});
  document.body.appendChild(f);
  const dx=to.left-fromRect.left, dy=to.top-fromRect.top, sc=to.width/fromRect.width;
  const a=f.animate([{transform:'translate(0,0) scale(1)'},{transform:`translate(${dx*0.5}px,${dy*0.5-40}px) scale(${(1+sc)/2*1.1})`,offset:.5},{transform:`translate(${dx}px,${dy}px) scale(${sc})`}],
    {duration:ARRIVE_MS,easing:'cubic-bezier(.4,0,.3,1)'});
  await a.finished.catch(()=>{}); f.remove();
}
function deliverToBox(ci, item, fromRect){
  const b=S.queues[ci][0], idx=b.filled.length;
  b.filled.push(item); b.t[idx]=performance.now();
  setTimeout(()=>SFX.deliver(idx), ARRIVE_MS-20);
  if(b.filled.length>=BOX_NEED){
    setTimeout(()=>SFX.boxDone(), ARRIVE_MS+90);
    S.queues[ci].shift();
    const token={box:b, done:false}; S.closing[ci]=token;
    setTimeout(()=>{ if(S.closing[ci]===token){ token.done=true; renderBoxes(); } }, ARRIVE_MS+80);
    setTimeout(()=>{ if(S.closing[ci]===token){ S.closing[ci]=null; renderBoxes(ci); } }, ARRIVE_MS+330);
  }
  renderBoxes();
  const pip=document.querySelector(`.col[data-col="${ci}"] .pip:nth-child(${idx+1})`) || document.querySelector(`.col[data-col="${ci}"]`);
  fly(item, fromRect, pip);
}
function drainSlots(){
  let i=0;
  while(i<S.slots.length){
    const ci=activeBoxFor(S.slots[i]);
    if(ci<0){ i++; continue; }
    const rect=document.querySelectorAll('#slots .slot')[i].getBoundingClientRect(), item=S.slots[i];
    S.slots.splice(i,1); S.slotT.splice(i,1); renderSlots();
    deliverToBox(ci,item,rect); i=0;
  }
}

/* ---- player actions (never wait for animations) ---- */
function tap(r,c){
  if(S.busy||S.over||S.moves<=0||S.slots.length>=SLOT_MAX) return; const t=S.grid[r][c]; if(!t) return;
  if(!TUT.canTap(r,c)) return;
  S.moves--; updateHUD(); SFX.pick();
  const rect=t.el.querySelector('.face').getBoundingClientRect();
  S.grid[r][c]=null; t.el.remove(); S.tiles.delete(t.id);
  const ci=activeBoxFor(t.item);
  if(ci>=0) deliverToBox(ci,t.item,rect);
  else {
    const i=S.slots.length; S.slots.push(t.item); S.slotT[i]=performance.now(); renderSlots();
    fly(t.item,rect,document.querySelectorAll('#slots .slot')[i]);
    setTimeout(()=>{ SFX.slot(); if(S.slots.length>=SLOT_MAX-1) SFX.warn(); }, ARRIVE_MS-20);
    if(S.slots.length>=SLOT_MAX-1){ const sl=document.getElementById('slots'); sl.classList.remove('warn'); void sl.offsetWidth; sl.classList.add('warn'); }
  }
  drainSlots();
  focusCells = gravitySpawn();
  scheduleStep(200);
  checkEnd();
  TUT.done();
}
function swap(r1,c1,r2,c2){
  if(S.busy||S.over||S.moves<=0) return; if(r2<0||c2<0||r2>=S.rows||c2>=S.cols) return;
  const a=S.grid[r1][c1], b=S.grid[r2][c2]; if(!a||!b||a.item===b.item) return;
  if(!TUT.canSwap(r1,c1,r2,c2)) return;
  S.moves--; updateHUD(); SFX.swap(); mergeChain=0;
  S.grid[r1][c1]=b; S.grid[r2][c2]=a; place(a,r2,c2); place(b,r1,c1);
  focusCells=[[r2,c2],[r1,c1]];
  scheduleStep(170);
  checkEnd();
  TUT.done();
}

let drag=null;
boardEl.addEventListener('pointerdown',e=>{
  const bx=boardEl.getBoundingClientRect(), c=Math.floor((e.clientX-bx.left)/cell), r=Math.floor((e.clientY-bx.top)/cell);
  if(r<0||c<0||r>=S.rows||c>=S.cols) return;
  drag={r,c,x:e.clientX,y:e.clientY,done:false}; boardEl.setPointerCapture(e.pointerId);
  S.grid[r][c]?.el.classList.add('sel');
});
boardEl.addEventListener('pointermove',e=>{
  if(!drag||drag.done) return; const dx=e.clientX-drag.x, dy=e.clientY-drag.y, th=cell*0.35;
  if(Math.abs(dx)<th && Math.abs(dy)<th) return;
  drag.done=true; clearSel();
  if(Math.abs(dx)>Math.abs(dy)) swap(drag.r,drag.c,drag.r,drag.c+Math.sign(dx)); else swap(drag.r,drag.c,drag.r+Math.sign(dy),drag.c);
});
boardEl.addEventListener('pointerup',()=>{ if(drag&&!drag.done) tap(drag.r,drag.c); clearSel(); drag=null; });
boardEl.addEventListener('pointercancel',()=>{ clearSel(); drag=null; });
function clearSel(){ S.tiles.forEach(t=>t.el.classList.remove('sel')); }

function updateHUD(){ const m=document.getElementById('moves'); m.querySelector('b').textContent=S.moves; m.classList.toggle('low',S.moves<=5); }

/* ---- end states ---- */
function checkEnd(){
  if(S.over) return;
  if(S.queues.every(q=>!q.length)){
    S.over=true; collectAndWin(); return;
  }
  if(S.slots.length>=SLOT_MAX){ S.over=true; setTimeout(()=>showLose('slots'), 500); }
  else if(S.moves<=0 && !stepTimer){ S.over=true; setTimeout(()=>showLose('moves'), 450); }
}
async function collectAndWin(){
    S.busy=true; const gained={};
    while(stepTimer) await sleep(120);
    await sleep(250);
    const btn=document.getElementById('pantryBtn');
    const list=[]; for(let r=S.rows-1;r>=0;r--) for(let c=0;c<S.cols;c++){ const t=S.grid[r][c]; if(t && ITEMS[t.item].tier>=2) list.push(t); }
    await sleep(350);
    await Promise.all(list.map((t,i)=>(async()=>{
      await sleep(i*140);
      const rect=t.el.querySelector('.face').getBoundingClientRect(); t.el.style.opacity=0;
      await fly(t.item, rect, document.getElementById('pantryIcon'));
      SFX.collect(i);
      STOCK[t.item]=(STOCK[t.item]||0)+1; gained[t.item]=(gained[t.item]||0)+1; renderPantry();
      btn.classList.remove('bump'); void btn.offsetWidth; btn.classList.add('bump');
    })()));
    saveStock(); await sleep(300);
    const gainHTML = Object.keys(gained).length
      ? `<p style="margin-bottom:0">Kilerine eklendi</p><div class="gain">${Object.entries(gained).map(([k,n])=>`<div><span class="ic">${faceHTML(k,false)}</span>×${n}</div>`).join('')}</div>`
      : `<p>Tahtada kalan üst ürünler bölüm sonunda kilerine gider.</p>`;
    { const ratio=S.moves/S.L.moves, stars=ratio>=.3?3:ratio>=.12?2:1;
    const starSVG=i=>`<svg viewBox="0 0 24 24" class="${i<stars?'on':''}"><path d="${STAR_PATH}"/></svg>`;
    PROG.stars[levelIndex]=Math.max(PROG.stars[levelIndex]||0,stars); PROG.unlocked=Math.max(PROG.unlocked,Math.min(levelIndex+1,LEVELS.length-1)); saveProg();
    const next = levelIndex<LEVELS.length-1;
    SFX.win();
    showOverlay(`<h2>Siparişler hazır</h2><div class="stars">${[0,1,2].map(starSVG).join('')}</div>
      <p>${S.moves} hamle artırdın.</p>${gainHTML}
      ${next?'<button class="btn" data-act="next">Sonraki bölüm</button>':'<p>Tüm bölümleri bitirdin.</p>'}
      <button class="btn alt" data-act="retry">Bu bölümü tekrar oyna</button>`);
    S.busy=false; }
}
function showLose(kind){
  SFX.lose();
  if(kind==='slots'){
    showOverlay(`<h2>Raf taştı</h2><p>Bekleme rafına 5 ürün doldu. Yanlış kutuya giden ürünler rafta bekler, raf dolunca bölüm biter.</p><button class="btn" data-act="retry">Tekrar dene</button>`);
  } else {
    showOverlay(`<h2>Hamle bitti</h2><p>Kutuların ${S.queues.reduce((a,q)=>a+q.length,0)} tanesi hâlâ bekliyor. Birleştirmeleri daha erken planlamak hamle kazandırır.</p><button class="btn" data-act="retry">Tekrar dene</button>`);
  }
}
const overlay=document.getElementById('overlay');
function showOverlay(html){ document.getElementById('card').innerHTML=html; overlay.classList.add('show'); }
function closeOverlay(){ overlay.classList.remove('show'); }
overlay.addEventListener('click',e=>{
  const act=e.target.closest('[data-act]')?.dataset.act; if(!act) return;
  SFX.ui();
  if(act==='help') showHelp();
  if(act==='book') showRecipes();
  if(act==='dnext') closeDiscovery();
  if(act==='next') startLevel(levelIndex+1);
  if(act==='retry') startLevel(levelIndex);
  if(act==='close'){ closeOverlay(); }
  if(act==='play'){ closeOverlay(); firstRun=false; if(stockTotal()) showPrep(); }
  if(act==='plus'||act==='minus'){ const k=e.target.dataset.k; PICK[k]=Math.max(0,(PICK[k]||0)+(act==='plus'?1:-1)); drawPrep(); }
  if(act==='boost'){ applyBoost(); }
  if(act==='level'){ startLevel(+e.target.closest('[data-lv]').dataset.lv); }
});
document.getElementById('restartBtn').onclick=()=>startLevel(levelIndex);
function showLevels(){
  if(S.busy) return;
  const cells=LEVELS.map((L,i)=>{ const st=PROG.stars[i]||0;
    return `<button class="lv${i===levelIndex?' cur':''}" data-act="level" data-lv="${i}" ${i>PROG.unlocked?'disabled':''} aria-label="${L.tutorial?'Eğitim':'Bölüm '+i}">${L.tutorial?'★':i}<small>${[0,1,2].map(k=>`<svg viewBox="0 0 24 24" class="${k<st?'on':''}"><path d="${STAR_PATH}"/></svg>`).join('')}</small></button>`; }).join('');
  showOverlay(`<h2>Bölümler</h2><div class="levels">${cells}</div><button class="btn" data-act="help">Nasıl oynanır</button><button class="btn alt" data-act="book">Tarif defteri</button><button class="btn alt" data-act="close">Kapat</button>`);
}
document.getElementById('lvlTitle').onclick=showLevels;
const SPK_ON='<path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/>', SPK_OFF='<path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 9l5 6M22 9l-5 6"/>';
function renderSound(){ document.getElementById('soundIcon').innerHTML = SFX.on?SPK_ON:SPK_OFF; document.getElementById('soundBtn').setAttribute('aria-pressed', SFX.on); }
document.getElementById('bookBtn').onclick=()=>{ if(S.busy) return; if(!TUT.allowBtn('#bookBtn')) return; SFX.ui(); showRecipes(); TUT.done(); };
document.getElementById('soundBtn').onclick=()=>{ SFX.toggle(); renderSound(); };
renderSound();
window.addEventListener('pointerdown', ()=>SFX.unlock(), {once:true});
document.getElementById('pantryBtn').onclick=()=>{ if(S.busy||S.over) return;
  const rows=TIER2.map(k=>`<div class="sitem"><span class="ic">${faceHTML(k)}</span><div class="meta"><b>${ITEMS[k].name}</b>${STOCK[k]||0} adet</div></div>`).join('');
  showOverlay(`<h2>Kilerim</h2><div class="stock">${rows}</div><p>Bölüm başlarken bu ürünleri tahtaya ekleyebilirsin.</p><button class="btn" data-act="close">Kapat</button>`); };
function showDiscovery(item){
  const from=ITEMS[item].from;
  showOverlay(`<h2>Yeni tarif!</h2>
    <p style="font-weight:700;margin:2px 0 10px">İlk kez <b>${ITEMS[item].name}</b> yaptın.</p>
    <div class="book"><div class="fam"><div class="step"><span class="ic">${faceHTML(from)}</span><span class="x">×3</span>
      <span class="arrow">→</span><span class="ic">${faceHTML(item)}</span>
      <span class="lbl">${ITEMS[item].name}<i>3 × ${ITEMS[from].name}</i></span></div></div></div>
    <p class="book-note">Tüm tarifler yukarıdaki <b>tarif defteri</b> düğmesinde.</p>
    <button class="btn" data-act="dnext">Tamam</button>`);
}
/* returns true when a panel took over; checkEnd then waits for it to close */
function flushDiscoveries(){
  if(!discoverQ.length || S.over || overlay.classList.contains('show')) return false;
  S.busy=true; SFX.ui(); showDiscovery(discoverQ.shift()); return true;
}
function closeDiscovery(){
  if(discoverQ.length){ showDiscovery(discoverQ.shift()); return; }
  closeOverlay(); S.busy=false; checkEnd();
}
function showRecipes(){
  const fams=[['beans','espresso','pot'],['wheat','cookie','croissant'],['milk','scoop','cone'],['cherry','cupcake','cake']];
  const ic=k=>known(k)?`<span class="ic">${faceHTML(k)}</span>`:'<span class="ic unk">?</span>';
  const step=(from,to)=>`<div class="step${known(to)?'':' locked'}">${ic(from)}<span class="x">×3</span>
      <span class="arrow">→</span>${ic(to)}
      <span class="lbl">${known(to)?ITEMS[to].name:'???'}<i>3 × ${known(from)?ITEMS[from].name:'???'}</i></span></div>`;
  const rows=fams.map(([a,b,c])=>`<div class="fam">${step(a,b)}${step(b,c)}</div>`).join('');
  showOverlay(`<h2>Tarif Defteri</h2>
    <p class="book-note">Yan yana gelen <b>3 aynı ürün</b> tek bir üst ürüne dönüşür. Daha fazlası yan yana gelirse hepsi tek ürüne birleşir.</p>
    <div class="book">${rows}</div>
    <p class="book-note">Henüz yapmadığın ve bu bölümde istenmeyen tarifler <b>?</b> olarak durur — bir kez yapınca deftere işlenir.</p>
    <p class="book-note">Kutular istedikleri üründen <b>3 adet</b> ister. İsteyen kutu yoksa ürün bekleme rafına iner; raf 5'te dolar ve bölüm biter.</p>
    <button class="btn" data-act="close">Kapat</button>`);
}
function showHelp(first){
  if(first===true && !PROG.tutDone){
    showOverlay(`<div class="logo"><span class="lj">${faceHTML("pot",false)}</span><h2>Pantry Jam<small style="display:block;font-size:.95rem;font-weight:600;opacity:.7">Coffee Shop</small></h2></div>
      <p style="font-weight:700;margin:2px 0 4px">Küçük bir eğitim bölümüyle başlıyoruz.</p>
      <p style="opacity:.75;margin:0 0 6px">Dokunmayı, sürüklemeyi ve hamle sayısını adım adım göstereceğim. Tüm kuralları istediğin an sol üstteki başlıktan tekrar okuyabilirsin.</p>
      <button class="btn" data-act="play">Başla</button>`);
    return;
  }
  showOverlay(`<div class="logo"><span class="lj">${faceHTML("pot",false)}</span><h2>Pantry Jam<small style="display:block;font-size:.95rem;font-weight:600;opacity:.7">Coffee Shop</small></h2></div><ul class="help">
    <li><b>Dokun:</b> ürün, onu isteyen öndeki kutuya gider.</li>
    <li><b>Sürükle:</b> yan yana iki ürünün yerini değiştirir.</li>
    <li>3 veya daha fazla aynı ürün yan yana gelirse tek bir üst ürüne dönüşür: çekirdek espresso, buğday kurabiye, süt dondurma olur. 3 üst ürün de birleşip en değerli ürünü yapar: 3 espresso bir demlik olur.</li>
    <li>İsteyen kutu yoksa ürün bekleme rafına iner. Raf 5'te dolar.</li>
    <li>Bölüm sonunda tahtada kalan espresso, kurabiye, demlik gibi üst ürünler kilerine gider. Sonraki bölümlerin başında onları tahtaya ekleyebilirsin.</li>
    <li>Bölümler ve bu ekran için sol üstteki bölüm adına dokun. Sesi sağ üstten açıp kapatabilirsin.</li>
    <li>Her dokunuş ve yer değiştirme 1 hamle. Hamleler bitmeden tüm kutuları doldur.</li></ul>
    ${first===true?'':'<button class="btn alt" data-act="book">Tarif defteri</button>'}
    <button class="btn" data-act="${first===true?'play':'close'}">${first===true?'Başla':'Devam et'}</button>`);
}

/* ---- tutorial coach: forced tap / forced swipe, with moves counter callout ---- */
const TUT = (()=>{
  const el = document.getElementById('coach'), ring = el.querySelector('.ring'),
        hand = el.querySelector('.hand'), tip = el.querySelector('.tip'), veil = el.querySelector('.veil');
  let steps=[], i=-1, live=false, waiting=false;

  const cellRect = (r,c)=>{ const b=boardEl.getBoundingClientRect();
    return {left:b.left+c*cell, top:b.top+r*cell, width:cell, height:cell}; };
  const findItem = it => { for(let r=0;r<S.rows;r++) for(let c=0;c<S.cols;c++) if(S.grid[r][c]?.item===it) return [r,c]; return null; };

  function point(rect, text, sub, gesture, dir){
    el.hidden=false; el.classList.add('on');
    const pad = gesture==='info' ? 8 : 4;
    ring.style.display='block';
    ring.style.left=(rect.left-pad)+'px'; ring.style.top=(rect.top-pad)+'px';
    ring.style.width=(rect.width+pad*2)+'px'; ring.style.height=(rect.height+pad*2)+'px';
    const cx=rect.left+rect.width/2, cy=rect.top+rect.height/2;
    veil.style.setProperty('--mx',cx+'px'); veil.style.setProperty('--my',cy+'px');
    veil.style.setProperty('--mr',(Math.max(rect.width,rect.height)/2+pad+6)+'px');
    if(gesture==='info'){ hand.style.display='none'; }
    else {
      hand.style.display='block';
      hand.style.left=cx+'px'; hand.style.top=cy+'px';
      hand.className='hand '+(gesture==='swipe'?'swipeAnim':'tapAnim');
      if(gesture==='swipe'){ hand.style.setProperty('--sx',(dir[1]*cell*0.85)+'px'); hand.style.setProperty('--sy',(dir[0]*cell*0.85)+'px'); }
    }
    tip.innerHTML = text + (sub?`<small>${sub}</small>`:'') + (gesture==='info'?'<br><button class="btn" data-tut="next" style="margin-top:9px">Tamam</button>':'');
    tip.style.top=tip.style.bottom='';
    if(cy < innerHeight/2) tip.style.top = Math.min(innerHeight-120, rect.top+rect.height+22)+'px';
    else tip.style.bottom = Math.min(innerHeight-120, innerHeight-rect.top+22)+'px';
  }
  function hide(){ el.classList.remove('on'); el.hidden=true; }

  function show(){
    const st=steps[i]; if(!st){ finish(); return; }
    if(st.type==='info'){ point(st.rect(), st.tip, st.sub, 'info'); return; }
    if(st.type==='btn'){ point(document.querySelector(st.sel).getBoundingClientRect(), st.tip, st.sub, 'tap'); return; }
    const cellPos = st.cell(); if(!cellPos){ next(); return; }
    st.at = cellPos;
    point(cellRect(cellPos[0],cellPos[1]), st.tip, st.sub, st.type==='swipe'?'swipe':'tap', st.dir);
  }
  function next(){ i++; if(i>=steps.length){ finish(); return; }
    waiting=true; hide();
    const st=steps[i], d=st.wait||0;
    setTimeout(()=>{ waiting=false; if(live) show(); }, d);
  }
  function finish(){ live=false; hide(); PROG.tutDone=true; saveProg(); }

  document.getElementById('coach').addEventListener('click', e=>{
    if(e.target.closest('[data-tut="next"]')){ SFX.ui(); next(); }
  });
  window.addEventListener('resize', ()=>{ if(live && !waiting) show(); });

  const api = {
    get live(){ return live; },
    arm(){
      live=false; hide();
      steps=[
        {type:'tap', wait:250, cell:()=>[0,4],
         tip:'Ürüne <b>dokun</b> — onu isteyen kutuya gider.', sub:'Kahve çekirdeğine dokun'},
        {type:'swipe', wait:700, cell:()=>[3,3], dir:[0,-1],
         tip:'<b>Sürükle</b> — yan yana iki ürünün yerini değiştirir.', sub:'Çekirdeği sola sürükle'},
        {type:'info', wait:1400, rect:()=>{ const p=findItem('espresso'); return p?cellRect(p[0],p[1]):boardEl.getBoundingClientRect(); },
         tip:'3 aynı ürün yan yana geldi ve <b>espresso</b> oldu.', sub:'Üst ürünler daha değerli'},
        {type:'tap', wait:150, cell:()=>findItem('espresso'),
         tip:'Espresso’ya <b>dokun</b> ve kutusuna gönder.'},
        {type:'info', wait:800, rect:()=>document.getElementById('moves').getBoundingClientRect(),
         tip:'Her dokunuş ve sürükleme <b>1 hamle</b>. Sayaç burada.', sub:'Hamleler bitmeden kutuları doldur'},
        {type:'btn', wait:250, sel:'#bookBtn',
         tip:'Son olarak <b>tarif defteri</b>: neyin neye dönüştüğü burada yazar.', sub:'Defteri aç'}
      ];
      i=-1;
      const go=()=>{ if(overlay.classList.contains('show')){ setTimeout(go,200); return; } live=true; next(); };
      setTimeout(go,300);
    },
    stop(){ live=false; hide(); },
    /* gate: during a forced step only the highlighted move is accepted */
    canTap(r,c){
      if(!live) return true;
      const st=steps[i]; if(waiting||!st) return false;
      if(st.type!=='tap' || !st.at) return false;
      return st.at[0]===r && st.at[1]===c;
    },
    canSwap(r1,c1,r2,c2){
      if(!live) return true;
      const st=steps[i]; if(waiting||!st) return false;
      if(st.type!=='swipe' || !st.at) return false;
      return st.at[0]===r1 && st.at[1]===c1 && r2===r1+st.dir[0] && c2===c1+st.dir[1];
    },
    allowBtn(sel){
      if(!live) return true;
      const st=steps[i]; if(waiting||!st) return false;
      return st.type==='btn' && st.sel===sel;
    },
    done(){ if(live && !waiting) next(); }
  };
  return api;
})();

startLevel(Math.min(PROG.unlocked,LEVELS.length-1)); showHelp(true);
</script>
